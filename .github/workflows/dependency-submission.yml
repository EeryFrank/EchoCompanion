name: Dependency graph

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  submit-distributed-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v6
        with:
          # The two platform jars shade only the shared project output through
          # shadowBundle. Minecraft, loaders, build plugins, and test libraries
          # are supplied externally and are not embedded in either release jar.
          dependency-graph-include-configurations: '^shadowBundle$'
