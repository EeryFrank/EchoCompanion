plugins {
    id "com.github.johnrengelman.shadow"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common
    shadowBundle
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive = false }
    shadowBundle(project(path: ":common", configuration: "transformProductionFabric")) { transitive = false }
}

def expandedVersion = project.version
def expandedMinecraftVersion = rootProject.minecraft_version
def expandedModLicense = rootProject.mod_license

processResources {
    inputs.property "version", expandedVersion
    inputs.property "minecraft_version", expandedMinecraftVersion
    inputs.property "mod_license", expandedModLicense

    filesMatching("fabric.mod.json") {
        expand "version": expandedVersion,
                "minecraft_version": expandedMinecraftVersion,
                "mod_license": expandedModLicense
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev-shadow"
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = ""
}
