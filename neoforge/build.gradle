plugins {
    id "com.github.johnrengelman.shadow"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common
    shadowBundle
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive = false }
    shadowBundle(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive = false }
}

def expandedVersion = project.version
def expandedMinecraftVersion = rootProject.minecraft_version
def expandedNeoForgeVersion = rootProject.neoforge_version
def expandedModLicense = rootProject.mod_license

processResources {
    inputs.property "version", expandedVersion
    inputs.property "minecraft_version", expandedMinecraftVersion
    inputs.property "neoforge_version", expandedNeoForgeVersion
    inputs.property "mod_license", expandedModLicense

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": expandedVersion,
                "minecraft_version": expandedMinecraftVersion,
                "neoforge_version": expandedNeoForgeVersion,
                "mod_license": expandedModLicense
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev-shadow"
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = ""
}
